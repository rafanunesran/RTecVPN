# Publica um GitHub Release com os instaladores ao criar uma tag vX.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Criar release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tenta algumas vezes: a API do GitHub às vezes devolve 502 passageiro
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
            if gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "RTecVPN $TAG" \
                 --notes "Instaladores do RTecVPN $TAG para Android, Windows, macOS e Linux."; then exit 0; fi
            echo "Falhou (tentativa $i), tentando de novo em $((i * 10))s"; sleep $((i * 10))
          done
          exit 1

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            args: "--bundles msi,nsis"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Versão a partir da tag
        shell: bash
        working-directory: desktop
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '1' || '' }}
          # Chave pública do atualizador (variável do repositório), se você gerou suas próprias chaves
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          V="${TAG#v}"
          # Sem a chave do atualizador, gera os instaladores sem os pacotes de atualização
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$V';if(process.env.UPDATER_PUBKEY){c.plugins.updater.pubkey=process.env.UPDATER_PUBKEY};if(!process.env.HAS_UPDATER_KEY){c.bundle.createUpdaterArtifacts=false;console.log('::warning::Sem TAURI_SIGNING_PRIVATE_KEY: atualização automática do desktop desativada nesta versão')}require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Assina os pacotes de atualização (latest.json) para o atualizador do app
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ env.TAG }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore (se configurada nos secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RTECVPN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Aviso sem chave fixa
        if: env.RTECVPN_KEYSTORE == ''
        run: echo "::warning::Sem o secret ANDROID_KEYSTORE_BASE64 o APK sai com chave de debug e a atualização pelo app não funciona."
      - name: Compilar APK
        working-directory: android
        env:
          RTECVPN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RTECVPN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RTECVPN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export RTECVPN_VERSION="${TAG#v}"
          export RTECVPN_VERSION_CODE="${{ github.run_number }}"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "RTecVPN-${RTECVPN_VERSION}.apk"
      - name: Anexar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" "android/RTecVPN-${TAG#v}.apk" --clobber && exit 0
            sleep $((i * 10))
          done
          exit 1

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh release edit "$TAG" --draft=false --latest && exit 0
            sleep $((i * 10))
          done
          exit 1
